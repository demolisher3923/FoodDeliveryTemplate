<section class="menu-page">
	<div class="menu-layout">
		@if (isUser()) {
		<aside class="user-sidenav">
			<h3>User Panel</h3>
			<button type="button" [class.active]="activeUserSection === 'menu'"
				(click)="setActiveUserSection('menu')">Menu</button>
			<button type="button" [class.active]="activeUserSection === 'cart'"
				(click)="setActiveUserSection('cart')">Cart</button>
			<button type="button" [class.active]="activeUserSection === 'orders'"
				(click)="setActiveUserSection('orders')">My Orders</button>
		</aside>
		}

		<div class="menu-content">
			
			@if (isAdmin()) {
			<app-admin-menu-management></app-admin-menu-management>
			}

			@if (isUser() && activeUserSection === 'menu') {
			@if (loading) {
			<p>Loading menu...</p>
			} @else {
			<div class="menu-grid" id="menu-grid-section">
				@for (item of menuItems; track item.id) {
				<app-menu-item-card [item]="item" [isAdmin]="isAdmin()" [isUser]="isUser()"
					[quantity]="itemQuantities[item.id]" [isAdding]="orderLoadingId === item.id"
					(decrement)="decrementQuantity($event)" (increment)="incrementQuantity($event)"
					(addToCart)="placeOrder($event)">
				</app-menu-item-card>
				}
			</div>
			}
			}

			@if (isUser() && activeUserSection === 'cart') {
			<app-user-cart [cartItems]="cartItems" [cartTotal]="cartTotal"
				[isCheckingOut]="orderLoadingId === 'checkout'" [updatingCartItemId]="cartUpdatingItemId"
				(itemRemoved)="removeCartItem($event)" (quantityIncremented)="updateCartItemQuantity($event, 1)"
				(quantityDecremented)="updateCartItemQuantity($event, -1)" (checkoutClicked)="checkout()">
			</app-user-cart>
			}

			@if (isUser() && activeUserSection === 'orders') {
			<app-user-orders [myOrders]="myOrders" (refreshClicked)="loadMyOrders()">
			</app-user-orders>
			}
		</div>
	</div>
</section>
